# Base configuration. Every environment-specific value comes from environment variables (IVOROVI_*);
# secrets have no defaults here. See docs/runbooks/configuration.md.
spring:
  servlet:
    multipart:
      # student documents (5 MB) and student import files (10 MB) are limited by their services; the container allows a small envelope
      max-file-size: 11MB
      max-request-size: 12MB
  application:
    name: ivorovi-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${IVOROVI_DB_URL}
    username: ${IVOROVI_DB_APP_USER:ivorovi_app}
    password: ${IVOROVI_DB_APP_PASSWORD}
    hikari:
      maximum-pool-size: ${IVOROVI_DB_POOL_SIZE:20}
  flyway:
    url: ${IVOROVI_DB_URL}
    user: ${IVOROVI_DB_OWNER_USER:ivorovi_owner}
    password: ${IVOROVI_DB_OWNER_PASSWORD}
    schemas: ivorovi
    default-schema: ivorovi
    create-schemas: false
    locations: classpath:db/migration
    placeholders:
      appRole: ${IVOROVI_DB_APP_USER:ivorovi_app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: ivorovi
  data:
    redis:
      host: ${IVOROVI_REDIS_HOST:localhost}
      port: ${IVOROVI_REDIS_PORT:6379}
      password: ${IVOROVI_REDIS_PASSWORD:}
      ssl:
        enabled: ${IVOROVI_REDIS_SSL:false}
  cache:
    type: redis
  rabbitmq:
    host: ${IVOROVI_RABBITMQ_HOST:localhost}
    port: ${IVOROVI_RABBITMQ_PORT:5672}
    username: ${IVOROVI_RABBITMQ_USER:ivorovi}
    password: ${IVOROVI_RABBITMQ_PASSWORD}
    virtual-host: ${IVOROVI_RABBITMQ_VHOST:/}
    publisher-confirm-type: simple
  mail:
    host: ${IVOROVI_SMTP_HOST:localhost}
    port: ${IVOROVI_SMTP_PORT:1025}
    username: ${IVOROVI_SMTP_USER:}
    password: ${IVOROVI_SMTP_PASSWORD:}
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: non_null
    deserialization:
      # Strict request bodies: a stale or mistyped field must never be ignored (it could silently widen the
      # scope of a change, e.g. an unknown scope field turning a unit-level change into an organization-level one).
      fail-on-unknown-properties: true

server:
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  pattern:
    correlation: "[tenant=%X{tenantId:-} user=%X{userId:-} trace=%X{traceId:-}] "

ivorovi:
  deployment:
    mode: ${IVOROVI_DEPLOYMENT_MODE:SAAS}
    environment: ${IVOROVI_ENVIRONMENT:PRODUCTION}
  security:
    # Key for application-level encryption of sensitive personal fields (required; from the secret store).
    data-key: ${IVOROVI_DATA_KEY:}
    oidc:
      issuer: ${IVOROVI_OIDC_ISSUER}
      jwk-set-uri: ${IVOROVI_OIDC_JWKS}
      audience: ${IVOROVI_OIDC_AUDIENCE:ivorovi-api}
  # P2-03 / C-4: the same build runs as the administrative API (ADMIN) or the exam delivery API (DELIVERY); each refuses the
  # other's endpoints with 404. Every process writes a heartbeat used by the outage detector (C-3).
  process:
    role: ${IVOROVI_PROCESS_ROLE:ADMIN}
    heartbeat-enabled: ${IVOROVI_PROCESS_HEARTBEAT_ENABLED:true}
    heartbeat-interval: PT10S
  # Delivery boundary: candidate-realm tokens only (Q-03), exam application origin only (Q-07).
  delivery:
    issuer: ${IVOROVI_DELIVERY_OIDC_ISSUER}
    jwk-set-uri: ${IVOROVI_DELIVERY_OIDC_JWKS}
    audience: ivorovi-delivery
    allowed-origins: ${IVOROVI_EXAM_APP_ORIGINS:}
    candidate-per-minute: ${IVOROVI_RATE_LIMIT_CANDIDATE:240}
    tenant-per-minute: ${IVOROVI_RATE_LIMIT_DELIVERY_TENANT:120000}
    code-attempts-per-candidate-per-minute: 10
    # one exam hall behind a campus NAT shares an address; per-candidate and per-code limits remain the tight ones
    code-attempts-per-ip-per-minute: ${IVOROVI_DELIVERY_CODE_ATTEMPTS_PER_IP:300}
    code-attempts-per-code-per-minute: 5
  exams:
    exam-app-base-url: ${IVOROVI_EXAM_APP_BASE_URL:http://localhost:5174}
    outage-detector-enabled: ${IVOROVI_OUTAGE_DETECTOR_ENABLED:true}
    outage-threshold: ${IVOROVI_OUTAGE_THRESHOLD:PT45S}
    outage-check-interval: PT15S
    idp:
      # candidate realm admin API (view/manage users of that realm only): second-factor status and support resets
      admin-url: ${IVOROVI_IDP_ADMIN_URL:http://localhost:8180}
      realm: ${IVOROVI_CANDIDATE_IDP_REALM:ivorovi-candidates}
      client-id: ${IVOROVI_CANDIDATE_IDP_CLIENT_ID:ivorovi-candidate-provisioner}
      client-secret: ${IVOROVI_CANDIDATE_IDP_SECRET:}
  features:
    # e.g. "ai.*" on an on-premises deployment without an approved AI provider
    deployment-disabled: ${IVOROVI_FEATURES_DEPLOYMENT_DISABLED:}
  rate-limit:
    enabled: ${IVOROVI_RATE_LIMIT_ENABLED:true}
    user-read-per-minute: ${IVOROVI_RATE_LIMIT_USER_READ:300}
    user-write-per-minute: ${IVOROVI_RATE_LIMIT_USER_WRITE:60}
    tenant-per-minute: ${IVOROVI_RATE_LIMIT_TENANT:3000}
    failed-auth-per-ip-per-minute: ${IVOROVI_RATE_LIMIT_FAILED_AUTH_IP:30}
    public-per-ip-per-minute: ${IVOROVI_RATE_LIMIT_PUBLIC_IP:20}
  retention:
    outbox-days: 7
    # Removed and infected student documents are purged from object storage after this many days.
    document-days: ${IVOROVI_DOCUMENT_RETENTION_DAYS:30}
  # Student bulk import (increment 1.6): file limits, retention of source files/raw row values, background worker.
  imports:
    max-file-bytes: ${IVOROVI_IMPORT_MAX_FILE_BYTES:10485760}
    max-rows: ${IVOROVI_IMPORT_MAX_ROWS:10000}
    retention-days: ${IVOROVI_IMPORT_RETENTION_DAYS:30}
    batch-size: 100
    lease: PT2M
    max-attempts: 3
    worker-enabled: ${IVOROVI_IMPORT_WORKER_ENABLED:true}
    concurrency: ${IVOROVI_IMPORT_CONCURRENCY:2}
  # Malware scanning (ADR-0006): set IVOROVI_SCANNING_CLAMD_HOST (and _PORT) to enable the ClamAV adapter. Without a
  # scanner, documents stay quarantined; in STAGING/PRODUCTION uploads are refused (fail closed).
  # Integrations, API clients and webhooks (increment 1.7). Outbound calls are SSRF-guarded: HTTPS to public hosts only,
  # unless explicitly relaxed for local development.
  integrations:
    allow-private-networks: ${IVOROVI_INTEGRATIONS_ALLOW_PRIVATE_NETWORKS:false}
    allow-insecure-http: ${IVOROVI_INTEGRATIONS_ALLOW_INSECURE_HTTP:false}
    allowed-hosts: ${IVOROVI_INTEGRATIONS_ALLOWED_HOSTS:}
    request-timeout: PT5S
    run-attempts: 3
    failing-threshold: 3
    health-check-interval: ${IVOROVI_INTEGRATIONS_HEALTH_CHECK_INTERVAL:PT15M}
    # KI-59: suspend delegated API clients when their owner is suspended/deactivated; custodian checks (hourly)
    lifecycle-consumer-enabled: ${IVOROVI_INTEGRATIONS_LIFECYCLE_CONSUMER_ENABLED:true}
    custodian-check-cron: "0 17 * * * *"
    webhooks:
      dispatcher-enabled: ${IVOROVI_WEBHOOKS_DISPATCHER_ENABLED:true}
      consumer-enabled: ${IVOROVI_WEBHOOKS_CONSUMER_ENABLED:true}
      max-attempts: 8
      disable-after: 10
      backoff-base: PT30S
      concurrency: 4
  notifications:
    consumer-enabled: ${IVOROVI_NOTIFICATIONS_CONSUMER_ENABLED:true}
  outbox:
    exchange: ivorovi.events
    # KI-64 (2.0): parallel workers, one broker confirm per batch
    batch-size: 500
    publisher-threads: ${IVOROVI_OUTBOX_PUBLISHER_THREADS:4}
    drain-budget: PT5S
    publisher-enabled: true
    poll-interval: 1s
  storage:
    endpoint: ${IVOROVI_S3_ENDPOINT:}
    region: ${IVOROVI_S3_REGION:ap-south-1}
    bucket: ${IVOROVI_S3_BUCKET:ivorovi}
    access-key: ${IVOROVI_S3_ACCESS_KEY:}
    secret-key: ${IVOROVI_S3_SECRET_KEY:}
    path-style: ${IVOROVI_S3_PATH_STYLE:true}
    create-bucket: ${IVOROVI_S3_CREATE_BUCKET:false}
  mail:
    from: ${IVOROVI_MAIL_FROM:no-reply@ivorovi.invalid}
  identity:
    # Public address of the web application; invitation links point here.
    app-base-url: ${IVOROVI_APP_BASE_URL:http://localhost:5173}
    invitation-ttl: ${IVOROVI_INVITATION_TTL:P7D}
    provisioning:
      # Keycloak admin API through a confidential client that holds only realm-management manage-users/view-users.
      admin-url: ${IVOROVI_IDP_ADMIN_URL:http://localhost:8180}
      realm: ${IVOROVI_IDP_REALM:ivorovi}
      client-id: ${IVOROVI_IDP_PROVISIONER_CLIENT_ID:ivorovi-provisioner}
      client-secret: ${IVOROVI_IDP_PROVISIONER_SECRET:}

springdoc:
  # the staff API contract; delivery endpoints are served only by the DELIVERY process (exam app uses its own client)
  paths-to-exclude: /api/v1/delivery/**
  api-docs:
    enabled: ${IVOROVI_OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${IVOROVI_OPENAPI_ENABLED:true}
