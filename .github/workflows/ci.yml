name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build, unit + integration tests, architecture)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: gradle/actions/wrapper-validation@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and test (Testcontainers - Postgres, RabbitMQ, Valkey, SeaweedFS)
        run: ./gradlew :backend:api:build --no-daemon
      - name: OpenAPI contract is committed and current
        run: git diff --exit-code -- docs/api/openapi.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: backend-test-reports
          path: backend/api/build/reports/tests/
      - uses: actions/upload-artifact@v5
        with:
          name: api-jar
          path: backend/api/build/libs/ivorovi-api.jar
          retention-days: 3

  frontend:
    name: Frontend (lint, typecheck, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated API client matches the OpenAPI contract
        run: pnpm generate:api && git diff --exit-code -- packages/api-client/src/generated
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v5
        with:
          name: web-dist
          path: frontend/apps/web/dist
          retention-days: 3

  e2e:
    name: End-to-end (compose stack, real Keycloak)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: api-jar
          path: backend/api/build/libs
      - uses: actions/download-artifact@v5
        with:
          name: web-dist
          path: frontend/apps/web/dist
      - name: Generate throwaway secrets
        run: ./scripts/dev-setup.sh
      - name: Start stack
        working-directory: deploy/compose
        run: docker compose --profile app up -d --build --wait --wait-timeout 300
      - name: Deployment smoke test (through the web container)
        run: API_URL=http://localhost:8081 ./scripts/smoke-test.sh
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Playwright
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @ivorovi/web exec playwright install --with-deps chromium
          set -a; . ../deploy/compose/.env; set +a
          CI=1 pnpm e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: frontend/apps/web/playwright-report
      - name: Container logs on failure
        if: failure()
        working-directory: deploy/compose
        run: docker compose --profile app logs --no-color > compose.log; tail -n 300 compose.log
      - name: Tear down
        if: always()
        working-directory: deploy/compose
        run: docker compose --profile app down -v

  security:
    name: Security scan (dependencies, secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-dirs: frontend/node_modules
