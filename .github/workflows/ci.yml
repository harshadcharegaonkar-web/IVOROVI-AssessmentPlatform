name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build, unit + integration tests, architecture)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Build and test (Testcontainers - Postgres, RabbitMQ, Valkey, SeaweedFS)
        run: ./gradlew :backend:api:build :backend:devtools:build --no-daemon
      - name: OpenAPI contract is committed and current
        run: git diff --exit-code -- docs/api/openapi.json
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: backend-test-reports
          path: |
            backend/api/build/reports/tests/
            backend/devtools/build/reports/tests/
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: api-jar
          path: backend/api/build/libs/ivorovi-api.jar
          retention-days: 3

  frontend:
    name: Frontend (lint, typecheck, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated API client matches the OpenAPI contract
        run: pnpm generate:api && git diff --exit-code -- packages/api-client/src/generated
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Bundle budget (initial JS and lazy chunks, gzip)
        run: pnpm --filter @ivorovi/web budget
      - name: Exam app bundle budget (own budget, 120 kB initial gzip)
        run: pnpm --filter @ivorovi/exam budget
      - name: Exam app bundle contains no staff code (C-4)
        run: pnpm --filter @ivorovi/exam boundary
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: web-dist
          path: frontend/apps/web/dist
          retention-days: 3
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: exam-dist
          path: frontend/apps/exam/dist
          retention-days: 3

  e2e:
    name: End-to-end (compose stack, real Keycloak)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: api-jar
          path: backend/api/build/libs
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: web-dist
          path: frontend/apps/web/dist
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: exam-dist
          path: frontend/apps/exam/dist
      - name: Generate throwaway secrets
        run: ./scripts/dev-setup.sh
      - name: Start stack
        working-directory: deploy/compose
        run: docker compose --profile app up -d --build --wait --wait-timeout 300
      - name: Scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ivorovi-api
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ivorovi-web
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Deployment smoke test (through the web container)
        run: API_URL=http://localhost:8081 ./scripts/smoke-test.sh
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Playwright
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @ivorovi/web exec playwright install --with-deps chromium
          set -a; . ../deploy/compose/.env; set +a
          CI=1 pnpm e2e
      - name: Playwright (exam application, delivery process)
        working-directory: frontend
        run: |
          set -a; . ../deploy/compose/.env; set +a
          CI=1 E2E_BASE_URL=http://localhost:8082 E2E_STAFF_URL=http://localhost:8081 pnpm --filter @ivorovi/exam e2e
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/apps/web/playwright-report
            frontend/apps/exam/playwright-report
      - name: Container logs on failure
        if: failure()
        working-directory: deploy/compose
        run: docker compose --profile app logs --no-color > compose.log; tail -n 300 compose.log
      - name: Tear down
        if: always()
        working-directory: deploy/compose
        run: docker compose --profile app down -v

  security:
    name: Security scan (dependencies, secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-dirs: frontend/node_modules
